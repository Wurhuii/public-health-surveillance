<head>

<title>重点场所公共卫生风险信号</title>
<style>
:root{--nav:#102d49;--ink:#18324b;--sub:#65788b;--line:#dbe5ee;--paper:#fff;--bg:#f3f6f9;--accent:#2464c7;--red:#b72f35}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #83acf0;outline-offset:2px}header{background:var(--nav);color:#fff;padding:18px 30px}.head{max-width:1500px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{font-size:20px;font-weight:700}.brand small{display:block;color:#bfd0df;font-size:12px;font-weight:400}.health{padding:5px 10px;border:1px solid #54718c;border-radius:20px;font-size:12px;color:#dce8f2}.notice{padding:9px 30px;background:#fff7e4;border-bottom:1px solid #ead8ac;color:#775719;font-size:12px}.shell{max-width:1500px;margin:auto;padding:24px 30px 40px}.topline{display:flex;align-items:end;justify-content:space-between;gap:16px;flex-wrap:wrap}.eyebrow{color:var(--accent);font-weight:700;font-size:12px;letter-spacing:1px}.topline h1{font-size:27px;margin:2px 0}.muted{color:var(--sub)}.small{font-size:12px}.button{border:1px solid #c8d7e4;background:#fff;color:var(--ink);border-radius:6px;padding:8px 14px}.primary{background:var(--accent);border-color:var(--accent);color:#fff}.button:disabled{opacity:.55;cursor:not-allowed}.controls{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.summary{display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border:1px solid var(--line);border-radius:10px;margin:20px 0;overflow:hidden}.summary>div{padding:17px 22px;border-right:1px solid var(--line)}.summary>div:last-child{border:0}.summary b{font-size:27px;display:block;line-height:1.25;margin:3px 0}.summary span{font-size:12px;color:var(--sub)}.panel{background:#fff;border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:16px}.filters{display:flex;align-items:end;gap:12px;flex-wrap:wrap}.filters label{display:grid;gap:5px;color:var(--sub);font-size:12px}.filters select,.filters input{border:1px solid #c8d7e4;border-radius:6px;background:#fff;padding:8px 10px;min-width:130px;color:var(--ink)}.filters input{min-width:230px}.tablewrap{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:auto}table{border-collapse:collapse;width:100%;text-align:left}thead{background:#eaf0f6;color:#425c74}th{font-size:12px;font-weight:600;white-space:nowrap;padding:13px 14px}td{padding:15px 14px;border-top:1px solid #e5ebf0;vertical-align:top}tbody tr:hover{background:#f8fafd}.nowrap{white-space:nowrap}.place{font-weight:650;min-width:125px}.signal{border:0;background:none;padding:0;color:var(--accent);font-weight:650;text-align:left;min-width:210px;line-height:1.65}.key{min-width:170px}.pill{display:inline-block;border-radius:4px;padding:2px 8px;font-size:12px;white-space:nowrap;background:#edf2f6;color:#4c6277}.Blue{background:#e7f0ff;color:#235ca6}.Yellow{background:#fff1bd;color:#7b5e00}.Orange{background:#ffe7d7;color:#94430f}.Red{background:#fde5e6;color:#a62c31}.delay{background:#fff0d5;color:#855d11}.ok{background:#e5f5eb;color:#237041}.empty{text-align:center;padding:58px 20px;color:var(--sub)}#detailView{display:none}.back{border:0;background:none;color:var(--accent);padding:0;margin-bottom:14px}.detail-head{display:flex;justify-content:space-between;gap:20px;align-items:start}.detail-head h1{font-size:24px;margin:3px 0}.meta{display:flex;gap:18px;flex-wrap:wrap;color:var(--sub);font-size:12px;margin-top:12px}.tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin:18px 0}.tabs button{border:0;border-bottom:3px solid transparent;background:transparent;color:var(--sub);padding:9px 1px}.tabs button.active{border-color:var(--accent);color:var(--accent);font-weight:700}.grid{display:grid;grid-template-columns:1.65fr 1fr;gap:17px}.note{padding:11px 13px;background:#f3f7fb;border-radius:6px;color:#496176;margin:12px 0}.note.warn{background:#fff4df;color:#805c17}.metricgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}.metric{background:#f3f7fa;border-radius:7px;padding:14px}.metric span{display:block;color:var(--sub);font-size:12px}.metric b{display:block;font-size:21px;margin:5px 0}.kv{display:grid;grid-template-columns:115px 1fr;gap:9px 18px;margin:0}.kv dt{color:var(--sub)}.kv dd{margin:0;overflow-wrap:anywhere}.kv dt,.kv dd{border-bottom:1px solid #edf1f5;padding-bottom:8px}.detectors td{padding:9px 11px}.alarm{color:var(--red);font-weight:700}.good{color:#287345}.source-tag{font-size:11px;background:#e7ebff;color:#3b4592;border-radius:4px;padding:2px 7px}.source-tag.template{background:#eceff2;color:#596674}.statusline{min-height:22px;color:var(--sub)}@media(max-width:1000px){.summary{grid-template-columns:repeat(2,1fr)}.summary>div{border-bottom:1px solid var(--line)}.grid{grid-template-columns:1fr}}@media(max-width:700px){header,.notice{padding-left:16px;padding-right:16px}.shell{padding:18px 12px}.topline h1{font-size:22px}.summary{grid-template-columns:1fr 1fr}.summary>div{padding:13px}.filters label,.filters select,.filters input{width:100%}.filters label{flex:1 1 145px}.detail-head{display:block}.metricgrid{grid-template-columns:1fr}.kv{grid-template-columns:92px 1fr}}
</style>
</head>
<body>
<header><div class="head"><div class="brand">重点场所公共卫生风险信号<small>省级公共卫生风险监测多 Agent 系统</small></div><div class="health" id="health">服务检查中</div></div></header>
<div class="notice">当前颜色展示模型风险分层，蓝、黄、橙、红的正式业务触发阈值仍需协和确认。信号用于提示核查，不代表已确认聚集或暴发。</div>
<main class="shell">
<section id="listView">
<div class="topline"><div><div class="eyebrow">FOCUS PLACE SIGNALS</div><h1>重点场所信号总览</h1><div class="muted">按城市、场所、预警等级和数据时效查看需要核查的异常线索</div></div><div class="controls"><button class="button" onclick="startRun(false)">运行监测</button><button class="button primary" onclick="startRun(true)">注入异常并运行</button></div></div>
<div id="runStatus" class="statusline"></div><div class="summary" id="summary"></div><section class="panel" id="skySummary"></section>
<div class="panel filters"><label>城市<select id="city"><option value="">全部城市</option></select></label><label>场所类型<select id="setting"><option value="">全部场所</option></select></label><label>预警类型<select id="type"><option value="">全部类型</option><option>苗头预警</option><option>风险预警</option></select></label><label>预警等级<select id="level"><option value="">全部等级</option><option value="Blue">蓝色 提示</option><option value="Yellow">黄色 关注</option><option value="Orange">橙色 警戒</option><option value="Red">红色 重要</option></select></label><label>数据时效<select id="freshness"><option value="">全部状态</option><option value="正常">更新正常</option><option value="延迟">存在延迟</option><option value="未知">时效未知</option></select></label><label>搜索<input id="query" placeholder="场所、地区、信号或ID"></label><button class="button" id="clear">清空筛选</button></div>
<div class="tablewrap"><table><thead><tr><th>信号产生时间</th><th>行政区域 / 类型</th><th>场所名称 / 编号</th><th>预警信号</th><th>等级</th><th>核查 / 数据</th><th>关键依据</th></tr></thead><tbody id="riskRows"></tbody></table></div>
</section>
<section id="detailView"><button class="back" id="back">← 返回信号列表</button><div id="detail"></div><div id="policy"></div></section>
</main>
<script>
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sourceLabels={hospital:'医疗机构',care_home:'养老机构',school:'学校',yichang_focus:'宜昌重点场所'},syndromeLabels={respiratory:'急性呼吸道症候群',digestive:'消化道症候群',fever:'发热症候群'},grade={Blue:'蓝色 · 提示',Yellow:'黄色 · 关注',Orange:'橙色 · 警戒',Red:'红色 · 重要'};
let all=[],runsById={},selected=null,tab='overview';
function parseDate(value){if(!value)return null;const d=new Date(String(value).slice(0,10));if(!Number.isNaN(d.getTime()))return d;const m=String(value).match(/^(\d{4})-W(\d{2})$/);if(!m)return null;const jan4=new Date(Date.UTC(+m[1],0,4)),monday=new Date(jan4);monday.setUTCDate(jan4.getUTCDate()-((jan4.getUTCDay()+6)%7)+(+m[2]-1)*7);return monday}
function daysLate(updated,expected){const d=parseDate(updated);return d?Math.max(0,Math.floor((Date.now()-d.getTime())/86400000)-(expected||1)):null}
function levelOf(x){return x.level==='high'?'Red':x.level==='medium'?'Orange':x.level==='watch'?'Blue':'Yellow'}
function oldSignalName(x,s,t){if(x.source==='hospital'&&x.syndrome==='respiratory')return '院内急性呼吸道传染病聚集线索';if(x.source==='care_home'&&x.syndrome==='respiratory')return '入住老人急性呼吸道传染病异常增多';if(x.source==='school'&&x.syndrome==='respiratory')return '学生急性呼吸道症候群发病水平异常上升';return `${s}${t}监测异常线索`}
function view(x){const e=x.evidence||{},p=e.presentation||{},run=runsById[x.run_id]||{},setting=p.setting_type||sourceLabels[x.source]||'重点场所',target=p.monitored_target||syndromeLabels[x.syndrome]||x.syndrome||'监测对象待补充',city=p.city||(x.source==='yichang_focus'?'宜昌市':'未提供'),region=[p.province,city==='未提供'?'':city,p.district].filter(Boolean).join(' ')||'行政区域待补充';let place=p.place_name||e.scope_label||'';if(!place||/^[a-f0-9]{20,}$/i.test(place))place=e.scope_type==='province'?(city!=='未提供'?city:region):'场所名称待补充';const unit=p.analysis_unit||'';if(unit&&!place.includes(unit))place=`${place} / ${unit}`;const updated=p.data_updated_at||x.date,expected=p.expected_update_interval_days||(x.source==='school'?31:x.source==='care_home'?7:1),late=p.data_delay_days??daysLate(updated,expected),freshness=p.data_status||(late===null?'未知':late>0?'延迟':'正常'),generated=p.generated_at||run.started_at||x.date||'—';return {...x,e,p,setting,target,city,region,place,placeCode:p.place_code||'待配置',updated,late,freshness,generated,warningType:p.warning_type||'苗头预警',signalName:p.signal_name||oldSignalName(x,setting,target),levelCode:levelOf(x),verify:p.verification_status||'待核查',window:p.monitoring_window||x.date||'—',key:p.key_indicator||`监测值 ${x.observed??'—'} 例，模型预期 ${x.expected??'—'} 例`,hint:p.verification_hint||'请核对病例明细、统计时段、数据完整性及场所内时空聚集情况。'}}
function populate(id,values){const el=$(id),current=el.value;el.querySelectorAll('option:not(:first-child)').forEach(x=>x.remove());[...new Set(values.filter(v=>v&&v!=='未提供'))].sort().forEach(v=>{const o=document.createElement('option');o.value=o.textContent=v;el.appendChild(o)});el.value=current}
function filtered(){const q=$('query').value.trim().toLowerCase();return all.filter(r=>(!$('city').value||r.city===$('city').value)&&(!$('setting').value||r.setting===$('setting').value)&&(!$('type').value||r.warningType===$('type').value)&&(!$('level').value||r.levelCode===$('level').value)&&(!$('freshness').value||r.freshness===$('freshness').value)&&(!q||`${r.place} ${r.region} ${r.signalName} ${r.signal_id}`.toLowerCase().includes(q))).sort((a,b)=>String(b.generated).localeCompare(String(a.generated)))}
function timeParts(value){const text=String(value||'—').replace('T',' '),parts=text.split(' ');return [parts[0]||'—',parts[1]||'—']}
function renderList(){const rows=filtered(),rank={Red:4,Orange:3,Yellow:2,Blue:1},focus=rows.slice().sort((a,b)=>rank[b.levelCode]-rank[a.levelCode]||String(b.generated).localeCompare(String(a.generated)))[0],types=[...new Set(rows.map(x=>x.setting))];$('summary').innerHTML=[[rows.length,'筛选内信号'],[rows.filter(x=>x.levelCode==='Red').length,'红色重要'],[rows.filter(x=>x.verify==='待核查').length,'待核查'],[rows.filter(x=>x.freshness==='延迟').length,'数据更新延迟'],[new Set(rows.map(x=>x.place)).size,'涉及场所']].map(([n,l])=>`<div><b>${esc(n)}</b><span>${l}</span></div>`).join('');$('skySummary').innerHTML=`<div class="eyebrow">SKY-EYE SUMMARY</div><h2>天眼摘要视图</h2>${focus?`<p>当前筛选范围内共发现 <b>${rows.length}</b> 条呼吸道传染病风险信号，涉及 ${esc(types.join('、')||'待补充场所')}。优先关注 <b>${esc(focus.region)}</b> 的 <b>${esc(focus.place)}</b>：${esc(focus.signalName)}。</p><div class="note ${rows.some(x=>x.freshness==='延迟')?'warn':''}">${rows.some(x=>x.freshness==='延迟')?`其中 ${rows.filter(x=>x.freshness==='延迟').length} 条信号存在数据更新延迟，应先核实到报完整性。`:'当前筛选内未识别到数据更新延迟。'}摘要仅用于研判排序，不代表确认暴发。</div>`:'<p class="muted">当前筛选范围内没有可汇总的呼吸道传染病风险信号。</p>'}`;$('riskRows').innerHTML=rows.length?rows.map(r=>{const t=timeParts(r.generated);return `<tr><td class="nowrap"><b>${esc(t[0])}</b><br><span class="muted">${esc(t[1])}</span></td><td><div>${esc(r.region)}</div><span class="pill">${esc(r.setting)}</span></td><td><div class="place">${esc(r.place)}</div><div class="small muted">场所编号：${esc(r.placeCode)}</div></td><td><div><span class="pill">${esc(r.warningType)}</span></div><button class="signal" data-open="${esc(r.signal_id)}">${esc(r.signalName)}</button><div class="small muted">${esc(r.target)}</div></td><td><span class="pill ${r.levelCode}">${grade[r.levelCode]}</span></td><td><span class="pill">${esc(r.verify)}</span> <span class="pill ${r.freshness==='延迟'?'delay':r.freshness==='正常'?'ok':''}">${r.freshness==='延迟'?`延迟 ${r.late} 天`:r.freshness==='正常'?'更新正常':'时效未知'}</span><div class="small muted">更新至 ${esc(r.updated||'—')}</div></td><td class="key">${esc(r.key)}</td></tr>`}).join(''):'<tr><td colspan="7" class="empty">当前筛选条件下没有风险信号</td></tr>';document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openDetail(b.dataset.open))}
function sourceBadge(r){const s=r.explanation_source||'unknown',names={llm:'LLM 生成',template:'模板生成',template_fallback:'LLM失败，模板回退',template_revision:'审计修订模板',human_review:'等待人工复核',unknown:'历史记录'};return `<span class="source-tag ${s==='llm'?'':'template'}">${esc(names[s]||s)}</span>`}
function escapeHtml(value){return esc(value)}
function explanationHtml(r){const visibleText=r.explanation||'本条风险信号尚未生成解释。';return `${sourceBadge(r)}<p>${escapeHtml(visibleText)}</p>`}
function delayNote(r){if(r.freshness==='延迟')return `<div class="note warn"><b>数据更新延迟：</b>本信号使用的数据更新至 ${esc(r.updated)}，按该来源预期更新间隔计算已延迟 ${esc(r.late)} 天。请先核查数据到报情况；无新数据不代表无异常，信号生成时间也不等同于事件发生时间。</div>`;if(r.freshness==='未知')return '<div class="note warn">缺少可解析的数据更新时间，暂时无法判断信号延迟程度，请先核查数据到报情况。</div>';return ''}
function detectorTable(r){const names={ewma:'EWMA',cusum:'CUSUM',shewhart:'Shewhart'},scores=r.e.scores||{},ths=r.e.thresholds||{},alarms=r.e.alarms||{};return `<table class="detectors"><thead><tr><th>检测器</th><th>分数</th><th>阈值</th><th>结果</th></tr></thead><tbody>${Object.keys(names).map(k=>`<tr><td>${names[k]}</td><td>${esc(scores[k]??'—')}</td><td>${esc(ths[k]??'—')}</td><td class="${alarms[k]?'alarm':'good'}">${alarms[k]?'告警':'未告警'}</td></tr>`).join('')}</tbody></table>`}
function renderPolicy(r){$('policy').innerHTML=`<article class="panel"><h2>分析口径与数据协同</h2><dl class="kv"><dt>分析粒度</dt><dd>${esc(r.p.analysis_unit||r.setting)}</dd><dt>场所编号</dt><dd>${esc(r.placeCode)}<br><span class="small muted">正式编号规则尚未确定</span></dd><dt>对比口径</dt><dd>${esc(r.p.comparison_policy||'按连续监测周期与历史基线比较')}</dd><dt>身份关联</dt><dd>${esc(r.p.identity_linkage||'不适用')}</dd><dt>更新规则</dt><dd>${esc(r.p.data_update_rule||'按来源配置的更新周期判断')}</dd></dl></article>`}
function renderDetail(){const r=selected;if(!r)return;let body='';if(tab==='overview')body=`${delayNote(r)}<div class="grid"><div><article class="panel"><h2>信号内容 ${sourceBadge(r)}</h2><p>${esc(r.explanation||'本条风险信号尚未生成解释。')}</p><div class="metricgrid"><div class="metric"><span>监测值</span><b>${esc(r.observed??'—')}</b><span>例</span></div><div class="metric"><span>模型预期</span><b>${esc(r.expected??'—')}</b><span>例</span></div><div class="metric"><span>预期差值</span><b>${Number.isFinite(+r.observed-+r.expected)?esc((+r.observed-+r.expected).toFixed(2)):'—'}</b><span>例</span></div></div><div class="note">系统识别的是异常线索。等级和解释用于辅助核查，不等同于临床诊断、聚集性疫情认定或处置指令。</div></article><article class="panel"><h2>建议核查内容</h2><p>${esc(r.hint)}</p><div class="small muted">建议内容与信号证据分开显示，后续核查结论应保留人员、时间、依据和处理记录。</div></article></div><aside><article class="panel"><h2>时间与地点</h2><dl class="kv"><dt>信号生成</dt><dd>${esc(String(r.generated).replace('T',' '))}</dd><dt>数据更新至</dt><dd>${esc(r.updated||'—')}</dd><dt>统计时段</dt><dd>${esc(r.window)}</dd><dt>行政区域</dt><dd>${esc(r.region)}</dd><dt>场所类型</dt><dd>${esc(r.setting)}</dd><dt>场所名称</dt><dd>${esc(r.place)}</dd><dt>具体位置</dt><dd>${esc(r.p.location||'未提供')}</dd></dl></article><article class="panel"><h2>核查状态</h2><p><span class="pill">${esc(r.verify)}</span></p><div class="note">责任人：未设定<br>截止时间：未设定<br>观察周期：未配置</div></article></aside></div>`;else body=`<div class="grid"><article class="panel"><h2>关键依据</h2><p><b>${esc(r.key)}</b></p>${detectorTable(r)}<h3>监测范围</h3><dl class="kv"><dt>监测对象</dt><dd>${esc(r.target)}</dd><dt>来源类型</dt><dd>${esc(r.p.source_type||'场所相关人群异常')}</dd><dt>统计时段</dt><dd>${esc(r.window)}</dd><dt>模型版本</dt><dd>${esc(r.e.model_version||'—')}</dd></dl></article><aside><article class="panel"><h2>信号标识与边界</h2><dl class="kv"><dt>信号 ID</dt><dd>${esc(r.signal_id)}</dd><dt>运行 ID</dt><dd>${esc(r.run_id||'—')}</dd><dt>预警类型</dt><dd>${esc(r.warningType)}</dd><dt>预警等级</dt><dd>${grade[r.levelCode]}</dd><dt>颜色口径</dt><dd>${esc(r.p.warning_level_scheme||'模型分层，业务阈值待核定')}</dd><dt>需人工复核</dt><dd>${r.requires_human_review?'是':'否'}</dd></dl>${delayNote(r)}</article></aside></div>`;$('detail').innerHTML=`<div class="detail-head"><div><div class="eyebrow">${esc(r.warningType)} / ${esc(r.setting)}</div><h1>${esc(r.signalName)}</h1><div class="muted">${esc(r.region)} · ${esc(r.place)}</div></div><span class="pill ${r.levelCode}">${grade[r.levelCode]}</span></div><div class="meta"><span>信号 ID ${esc(r.signal_id)}</span><span>核查状态 ${esc(r.verify)}</span><span>数据状态 ${esc(r.freshness)}</span></div><div class="tabs"><button data-tab="overview" class="${tab==='overview'?'active':''}">信号概览</button><button data-tab="evidence" class="${tab==='evidence'?'active':''}">证据与规则</button></div>${body}`;document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;renderDetail()})}
function openDetail(id){selected=all.find(x=>x.signal_id===id);tab='overview';$('listView').style.display='none';$('detailView').style.display='block';renderDetail();renderPolicy(selected);scrollTo(0,0)}
async function startRun(inject){const st=$('runStatus');st.textContent='监测流程运行中。启用本地大模型时，解释生成可能需要数分钟……';document.querySelectorAll('.controls button').forEach(b=>b.disabled=true);try{const res=await fetch('api/runs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({inject_outbreak:inject,injection_shape:'gradual',injection_magnitude:10,use_langgraph:true,autonomy_stage:3})});if(!res.ok)throw new Error(`HTTP ${res.status}`);const data=await res.json();st.textContent=`运行完成：${data.run_id||'结果已更新'}`;await load()}catch(e){st.textContent=`运行失败：${e.message}`}finally{document.querySelectorAll('.controls button').forEach(b=>b.disabled=false)}}
async function load(){try{const [rr,ur,hr]=await Promise.all([fetch('api/risks'),fetch('api/runs'),fetch('api/health')]);if(!rr.ok||!ur.ok||!hr.ok)throw new Error('接口不可用');const risks=await rr.json(),runs=await ur.json(),health=await hr.json();$('health').textContent=health.status==='ok'?'● 服务正常':'服务异常';runsById=Object.fromEntries((runs.runs||[]).map(x=>[x.run_id,x]));const raw=(risks.risks||[]).filter(x=>x.syndrome==='respiratory'),firstGenerated={};raw.forEach(x=>{const p=(x.evidence||{}).presentation||{},time=p.generated_at||(runsById[x.run_id]||{}).started_at||x.date;if(!firstGenerated[x.signal_id]||String(time)<String(firstGenerated[x.signal_id]))firstGenerated[x.signal_id]=time});const seen=new Set();all=raw.slice().reverse().filter(x=>!seen.has(x.signal_id)&&seen.add(x.signal_id)).map(view).map(x=>({...x,generated:firstGenerated[x.signal_id]||x.generated}));populate('city',all.map(x=>x.city));populate('setting',all.map(x=>x.setting));renderList()}catch(e){$('health').textContent='服务异常';$('riskRows').innerHTML=`<tr><td colspan="7" class="empty">数据加载失败：${esc(e.message)}</td></tr>`}}
['city','setting','type','level','freshness'].forEach(id=>$(id).onchange=renderList);$('query').oninput=renderList;$('clear').onclick=()=>{['city','setting','type','level','freshness','query'].forEach(id=>$(id).value='');renderList()};$('back').onclick=()=>{$('detailView').style.display='none';$('listView').style.display='block';selected=null};load();
</script>
