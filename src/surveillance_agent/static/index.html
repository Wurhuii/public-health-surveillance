<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>天眼 1.0 · 重点场所监测</title>
<style>
:root{--ink:#18314c;--sub:#5d7084;--line:#dce5ed;--blue:#245bc8;--paper:#fff;--nav:#122c46;--bg:#f3f6fa}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #5c96f2;outline-offset:2px}header{background:var(--nav);color:#fff;padding:18px 32px;display:flex;align-items:center;justify-content:space-between;gap:20px}header strong{font-size:20px;letter-spacing:1px}header small{display:block;color:#c0cddd}.switch{display:flex;background:#213f5d;padding:4px;border-radius:8px}.switch button{border:0;background:transparent;color:#d9e5f4;padding:8px 16px;border-radius:5px}.switch button[aria-pressed=true]{color:#142d46;background:#fff}.notice{background:#fff6df;color:#75530c;border-bottom:1px solid #ecd8a7;padding:9px 32px;font-size:12px}.shell{max-width:1500px;margin:auto;padding:25px 32px 35px}.row{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}h1{font-size:27px;margin:0 0 4px}h2{font-size:19px;margin:0 0 14px}h3{font-size:15px;margin:16px 0 8px}.muted{color:var(--sub)}.small{font-size:12px}.eyebrow{font-size:12px;font-weight:bold;letter-spacing:1px;color:var(--blue)}.button{border:1px solid #cbd8e4;border-radius:6px;background:#fff;color:var(--ink);padding:8px 13px}.primary{background:var(--blue);border-color:var(--blue);color:white}.button:disabled{opacity:.55;cursor:not-allowed}.controls{display:flex;gap:9px;flex-wrap:wrap}.summary{display:flex;margin:22px 0;background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px 0}.summary>div{padding:0 26px;border-right:1px solid var(--line);flex:1}.summary>div:last-child{border:0}.summary b{font-size:27px;display:block;line-height:1.2;margin:6px 0}.filters{display:flex;align-items:end;flex-wrap:wrap;gap:12px;margin-bottom:16px}.filters label{display:grid;gap:5px;font-size:12px;color:var(--sub)}input,select{border:1px solid #cbd8e4;border-radius:6px;background:#fff;color:var(--ink);padding:8px 10px}input{min-width:235px}select{min-width:125px}.panel{background:#fff;border:1px solid var(--line);border-radius:10px;padding:21px;margin-bottom:16px}.tablewrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:10px}table{width:100%;border-collapse:collapse;text-align:left}thead{background:#eaf0f6;color:#405871}th{font-size:12px;font-weight:600;white-space:nowrap;padding:13px 15px}td{padding:16px 15px;border-top:1px solid #e5ebf0;vertical-align:top}tbody tr:hover{background:#f8faff}.name{color:var(--blue);border:0;background:none;padding:0;text-align:left;font-weight:600;line-height:1.7;min-width:190px}.place{font-weight:600;min-width:150px}.nowrap{white-space:nowrap}.pill{font-size:12px;border-radius:4px;background:#edf2f7;color:#496178;padding:3px 8px;display:inline-block;white-space:nowrap}.Blue{background:#e6f0ff;color:#2357a2}.Yellow{background:#fff0c0;color:#755900}.Orange{background:#ffe8d8;color:#8b420f}.Red{background:#fde7e7;color:#a22f2f}.delay{background:#fff0d7;color:#835e18}.ok{background:#e6f5eb;color:#267047}.note{padding:11px 13px;background:#f5f8fc;border-radius:5px;color:#486079;margin:12px 0}.warn{background:#fff4df;color:#835e18}.hidden{display:none!important}.empty{text-align:center;padding:60px 20px;color:var(--sub)}.link{border:0;background:none;color:var(--blue);padding:0}.tabs{display:flex;gap:20px;margin:20px 0;border-bottom:1px solid var(--line)}.tabs button{border:0;border-bottom:3px solid transparent;background:transparent;padding:10px 1px;color:var(--sub)}.tabs button.active{color:var(--blue);border-color:var(--blue);font-weight:bold}.grid{display:grid;grid-template-columns:1.65fr 1fr;gap:18px}.kv{display:grid;grid-template-columns:130px 1fr;gap:10px 20px}.kv dt{color:var(--sub)}.kv dd{margin:0;overflow-wrap:anywhere}.kv dt,.kv dd{border-bottom:1px solid #eef2f7;padding-bottom:9px}.metricgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}.metric{padding:16px;background:#f4f7fa;border-radius:6px}.metric b{display:block;font-size:21px;margin:8px 0}.metric span{font-size:12px;color:var(--sub)}.coretable td:first-child{width:230px;color:var(--sub);font-size:12px}.fieldkey{font-family:monospace;font-size:11px;color:#8192a4}.source{font-size:11px;background:#e6eaff;color:#3b4592;padding:2px 7px;border-radius:4px}.source.template{background:#edf0f2;color:#596674}.status{min-height:23px;color:var(--sub)}footer{font-size:12px;color:#73849a;padding:18px 0}@media(max-width:850px){header{padding:15px;align-items:flex-start}.notice{padding:8px 15px}.shell{padding:20px 15px}.summary{display:grid;grid-template-columns:1fr 1fr}.summary>div{padding:10px 14px;border-bottom:1px solid var(--line)}.grid{grid-template-columns:1fr}.metricgrid{grid-template-columns:1fr}.filters label,.filters select,.filters input{width:100%}.filters label{flex:1 1 150px}.kv{grid-template-columns:100px 1fr}}
</style>
</head>
<body>
<header>
  <div><strong>天眼 1.0 · 重点场所监测</strong><small>信号输出工作台 / 实际监测数据</small></div>
  <div class="switch" aria-label="页面视角"><button id="cityMode" aria-pressed="true">城市侧工作台</button><button id="nationalMode" aria-pressed="false">天眼摘要视图</button></div>
</header>
<div class="notice">信号用于提示核查，不代表已确认聚集或暴发。机构名称和编号仅来自接入数据；源数据未提供时明确标记，不进行推断。</div>
<main class="shell">
<section id="listView">
  <div class="row"><div><div class="eyebrow">SIGNAL WORKSPACE</div><h1>预警信号</h1><div class="muted" id="viewCaption"></div></div><div class="controls" id="runControls"><button class="button" onclick="startRun(false)">运行监测</button><button class="button primary" onclick="startRun(true)">注入异常并运行</button></div></div>
  <div id="runStatus" class="status"></div><div class="summary" id="summary"></div>
  <div class="filters"><label>城市<select id="city"><option value="">全部城市</option></select></label><label>场所类型<select id="setting"><option value="">全部场所</option></select></label><label>预警类型<select id="type"><option value="">全部类型</option><option>苗头预警</option><option>风险预警</option></select></label><label>等级<select id="level"><option value="">全部等级</option><option value="Blue">蓝色 提示</option><option value="Yellow">黄色 关注</option><option value="Orange">橙色 警戒</option><option value="Red">红色 重要</option></select></label><label id="freshnessFilter">数据时效<select id="freshness"><option value="">全部状态</option><option>正常</option><option>延迟</option><option>未知</option></select></label><label>搜索机构或信号<input id="query" placeholder="机构名称、编号或信号"></label><button class="button" id="clear">清空筛选</button></div>
  <div class="row small muted" style="margin:8px 0"><span id="count"></span><span>同一 signal_id 仅展示最新版本</span></div>
  <div class="tablewrap"><table><thead id="head"></thead><tbody id="rows"></tbody></table><div id="empty" class="empty hidden">当前筛选无匹配信号；无匹配不等于无异常。</div></div>
</section>
<section id="detailView" class="hidden"><button id="back" class="link">← 返回信号列表</button><div id="detailHeader"></div><div class="tabs" id="tabs"></div><div id="detailBody"></div></section>
<footer>城市侧保留核查证据 · 天眼侧展示统一12字段摘要 · 未提供的名称、编号和规则明确留空</footer>
</main>
<script>
const $=id=>document.getElementById(id);
const escapeHtml=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const grade={Blue:'蓝色 · 提示',Yellow:'黄色 · 关注',Orange:'橙色 · 警戒',Red:'红色 · 重要'};
const settingCodes={'医院':'HOS','养老院':'ELD','学校':'SCH','农贸市场':'MKT','区域':'REG'};
const sourceCodes={'场所相关人群异常':'I','周边医疗机构':'N','社会面疫情':'C','人员活动度':'A','特殊病例':'S','多源综合':'M'};
let mode='city',all=[],runsById={},institutionCatalog={},selected=null,tab='overview';

function normalizeSetting(x,p){
  if(x.source==='hospital')return '医院';
  if(x.source==='care_home')return '养老院';
  if(x.source==='school')return '学校';
  if(x.source==='market')return '农贸市场';
  if(x.source==='yichang_focus')return p.setting_type==='养老机构'?'养老院':p.setting_type==='学校'?'学校':'医院';
  return p.setting_type||'区域';
}
function levelCode(level){return level==='high'?'Red':level==='medium'?'Orange':level==='watch'?'Blue':'Yellow'}
function parseDate(value){const d=new Date(String(value||'').slice(0,10));if(!Number.isNaN(d.getTime()))return d;const m=String(value||'').match(/^(\d{4})-W(\d{2})$/);if(!m)return null;const jan4=new Date(Date.UTC(+m[1],0,4)),out=new Date(jan4);out.setUTCDate(jan4.getUTCDate()-((jan4.getUTCDay()+6)%7)+(+m[2]-1)*7);return out}
function daysLate(value,expected){const d=parseDate(value);return d?Math.max(0,Math.floor((Date.now()-d.getTime())/86400000)-(expected||1)):null}
function view(x){
  const e=x.evidence||{},p=e.presentation||{},run=runsById[x.run_id]||{};
  const setting=normalizeSetting(x,p),city=p.city||(x.source==='yichang_focus'?'宜昌市':'未提供');
  const region=[p.province,city==='未提供'?'':city,p.district].filter(Boolean).join(' ')||'行政区域待补充';
  const regional=!!p.is_regional_aggregate||e.scope_type==='province',savedContributors=Array.isArray(p.contributing_places)?p.contributing_places:[],catalogContributors=Array.isArray(institutionCatalog[x.source])?institutionCatalog[x.source]:[],contributors=savedContributors.length?savedContributors:catalogContributors,lead=contributors[0]||{},contributorCount=Number(p.contributing_place_count||contributors.length||0);
  let place=regional&&lead.name?`${lead.name}${contributorCount>1?` 等 ${contributorCount} 家机构`:''}`:regional?`${setting}区域综合信号`:(p.place_name||e.scope_label||'机构名称源数据未提供');
  const unit=p.analysis_unit||'';if(unit&&!place.includes(unit))place=`${place} / ${unit}`;
  let placeCode=regional&&lead.code?`${lead.code}${contributorCount>1?` 等 ${contributorCount} 个编号`:''}`:regional?'多机构汇总':(p.place_code||'源数据未提供');
  const updated=p.data_updated_at||x.date,expected=p.expected_update_interval_days||(x.source==='school'?31:x.source==='care_home'?7:1),late=p.data_delay_days??daysLate(updated,expected),freshness=p.data_status||(late===null?'未知':late>0?'延迟':'正常');
  return {...x,e,p:{...p,contributing_places:contributors,contributing_place_count:contributorCount},setting,city,region,regional,place,placeCode,updated,late,freshness,generated:p.generated_at||run.started_at||x.date||'—',warningType:p.warning_type||'苗头预警',levelCode:levelCode(x.level),target:p.monitored_target||'急性呼吸道症候群',signalName:p.signal_name||`${setting}急性呼吸道症候群异常线索`,verify:p.verification_status||'待核查',window:p.monitoring_window||x.date||'—',key:p.key_indicator||`监测值 ${x.observed??'—'} 例，模型预期 ${x.expected??'—'} 例`,hint:p.verification_hint||'请核对病例明细、数据完整性和时空聚集情况。'};
}
function populate(id,values){const el=$(id),value=el.value;el.querySelectorAll('option:not(:first-child)').forEach(x=>x.remove());[...new Set(values.filter(Boolean))].sort().forEach(v=>{const o=document.createElement('option');o.value=o.textContent=v;el.appendChild(o)});el.value=value}
function filtered(){const q=$('query').value.trim().toLowerCase();return all.filter(r=>(!$('city').value||r.city===$('city').value)&&(!$('setting').value||r.setting===$('setting').value)&&(!$('type').value||r.warningType===$('type').value)&&(!$('level').value||r.levelCode===$('level').value)&&(!$('freshness').value||r.freshness===$('freshness').value)&&(!q||`${r.place} ${r.placeCode} ${r.region} ${r.signalName}`.toLowerCase().includes(q))).sort((a,b)=>String(b.generated).localeCompare(String(a.generated)))}
function timeCell(value){const text=String(value||'—').replace('T',' '),parts=text.split(' ');return `<span class="small">${escapeHtml(parts[0]||'—')}</span><br><b>${escapeHtml((parts[1]||'—').slice(0,8))}</b>`}
function summaryFields(r){return [
  ['预警信号ID','signal_id',r.signal_id],['上报时间','report_time','未上报'],['行政区划','area_code',r.region],['场所类型','setting_type',settingCodes[r.setting]||'REG'],['重点场所名称或编码','setting_id_name',`${r.placeCode}｜${r.place}`],['预警类型','warning_type',r.warningType==='苗头预警'?'E':'R'],['预警等级','warning_level',r.levelCode],['监测对象','monitored_target',r.target],['信号来源类型','signal_source_type',sourceCodes[r.p.source_type]||'I'],['统计时间范围','monitoring_window',r.window],['关键指标值','key_indicator_value',r.key],['信号描述与核查提示','signal_description_verification_hint',`${r.explanation||'尚无解释'} ${r.hint}`]
]}
function renderList(){
  const data=filtered();
  $('freshnessFilter').classList.toggle('hidden',mode==='national');$('runControls').classList.toggle('hidden',mode==='national');
  $('viewCaption').textContent=mode==='city'?'集中查看异常依据，核对线索与数据时效。':'展示城市侧可上报的统一摘要，不包含个人病例明细和本地任务。';
  const metrics=mode==='city'?[['筛选内信号',data.length],['待核查',data.filter(x=>x.verify==='待核查').length],['数据延迟',data.filter(x=>x.freshness==='延迟').length],['涉及机构',new Set(data.filter(x=>!x.regional).map(x=>`${x.setting}:${x.placeCode}`)).size]]:[['筛选内信号',data.length],['苗头预警',data.filter(x=>x.warningType==='苗头预警').length],['风险预警',data.filter(x=>x.warningType==='风险预警').length],['正式上报','未接入']];
  $('summary').innerHTML=metrics.map(([k,v])=>`<div><span class="muted small">${k}</span><b>${escapeHtml(v)}</b></div>`).join('');$('count').textContent=`显示 ${data.length} 条呼吸道传染病信号，共 ${all.length} 条`;
  const labels=[mode==='city'?'信号产生时间':'上报时间','城市 / 场所类型','场所名称','预警信号','等级',mode==='city'?'核查 / 数据':'监测对象','关键依据'];$('head').innerHTML='<tr>'+labels.map(x=>`<th>${x}</th>`).join('')+'</tr>';
  $('rows').innerHTML=data.map(r=>`<tr><td class="nowrap">${mode==='city'?timeCell(r.generated):'<span class="muted">未上报</span>'}</td><td>${escapeHtml(r.city)}<div class="small"><span class="pill">${escapeHtml(r.setting)}</span></div></td><td class="place">${escapeHtml(r.place)}<div class="muted small">${escapeHtml(r.placeCode)}</div></td><td><button class="name" data-open="${escapeHtml(r.signal_id)}">${escapeHtml(r.signalName)}</button><div class="small muted">${escapeHtml(r.warningType)}</div></td><td><span class="pill ${r.levelCode}">${grade[r.levelCode]}</span></td><td>${mode==='city'?`${escapeHtml(r.verify)}<div class="small pill ${r.freshness==='延迟'?'delay':r.freshness==='正常'?'ok':''}">${r.freshness==='延迟'?`数据延迟 ${r.late} 天`:r.freshness==='正常'?'更新正常':'时效未知'}</div>`:escapeHtml(r.target)}</td><td style="min-width:195px;max-width:270px">${escapeHtml(r.key)}</td></tr>`).join('');
  $('empty').classList.toggle('hidden',data.length>0);document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openDetail(b.dataset.open));
}
function explanationHtml(r){const visibleText=r.explanation||'本条信号尚未生成解释。',source=r.explanation_source==='llm'?'LLM 生成':'模板生成';return `<span class="source ${r.explanation_source==='llm'?'':'template'}">${source}</span><p>${escapeHtml(visibleText)}</p>`}
function delayNote(r){return r.freshness==='延迟'?`<div class="note warn"><b>数据更新延迟：</b>数据更新至 ${escapeHtml(r.updated)}，按当前来源更新规则计算延迟 ${escapeHtml(r.late)} 天。无新数据不代表无异常。</div>`:''}
function contributorHtml(r){const items=Array.isArray(r.p.contributing_places)?r.p.contributing_places:[];if(!r.regional||!items.length)return '';return `<div class="note"><b>区域汇总涉及 ${escapeHtml(r.p.contributing_place_count||items.length)} 家机构：</b><br>${items.map(x=>`${escapeHtml(x.name||'名称未提供')}（${escapeHtml(x.code||'编号未提供')}）`).join('、')}${Number(r.p.contributing_place_count||0)>items.length?'……':''}</div>`}
function coreTable(r){return `<table class="coretable"><tbody>${summaryFields(r).map(([cn,en,v])=>`<tr><td>${cn}<div class="fieldkey">${en}</div></td><td>${escapeHtml(v||'待补充')}</td></tr>`).join('')}</tbody></table>`}
function renderDetail(){
  const r=selected;if(!r)return;
  $('detailHeader').innerHTML=`<div class="row" style="margin-top:17px"><div><div class="eyebrow">${escapeHtml(r.warningType)} / ${escapeHtml(r.setting)}</div><h1>${escapeHtml(r.signalName)}</h1><div class="muted">${escapeHtml(r.city)} · ${escapeHtml(r.place)} · ${escapeHtml(r.placeCode)}</div></div><span class="pill ${r.levelCode}">${grade[r.levelCode]}</span></div>`;
  const tabs=mode==='national'?[['summary','12字段上报摘要']]:[['overview','信号详情'],['evidence','证据与规则'],['summary','12字段摘要']];if(!tabs.some(x=>x[0]===tab))tab=tabs[0][0];$('tabs').innerHTML=tabs.map(([id,text])=>`<button data-tab="${id}" class="${tab===id?'active':''}">${text}</button>`).join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;renderDetail()});
  if(tab==='summary'){$('detailBody').innerHTML=`<div class="note warn">本页为待上报摘要，正式上报接口、区划编码和场所编码字典尚未接入。</div><div class="panel"><h2>城市侧统一12字段摘要</h2>${coreTable(r)}</div>`;return}
  if(tab==='evidence'){$('detailBody').innerHTML=`${contributorHtml(r)}<div class="grid"><article class="panel"><h2>关键依据</h2><p><b>${escapeHtml(r.key)}</b></p><dl class="kv"><dt>监测对象</dt><dd>${escapeHtml(r.target)}</dd><dt>统计时段</dt><dd>${escapeHtml(r.window)}</dd><dt>分析粒度</dt><dd>${escapeHtml(r.p.analysis_unit||r.setting)}</dd><dt>对比口径</dt><dd>${escapeHtml(r.p.comparison_policy||'按连续监测周期与历史基线比较')}</dd><dt>数据更新规则</dt><dd>${escapeHtml(r.p.data_update_rule||'按来源配置')}</dd></dl></article><aside><article class="panel"><h2>数据协同与边界</h2><dl class="kv"><dt>机构名称</dt><dd>${escapeHtml(r.place)}</dd><dt>机构编号</dt><dd>${escapeHtml(r.placeCode)}</dd><dt>身份关联</dt><dd>${escapeHtml(r.p.identity_linkage||'不适用')}</dd><dt>模型版本</dt><dd>${escapeHtml(r.e.model_version||'—')}</dd><dt>人工复核</dt><dd>${r.requires_human_review?'需要':'暂不需要'}</dd></dl>${delayNote(r)}</article></aside></div>`;return}
  $('detailBody').innerHTML=`${delayNote(r)}<div class="grid"><div><article class="panel"><h2>信号内容解释</h2>${explanationHtml(r)}<div class="metricgrid"><div class="metric"><span>监测值</span><b>${escapeHtml(r.observed)}</b><span>例</span></div><div class="metric"><span>模型预期</span><b>${escapeHtml(r.expected)}</b><span>例</span></div><div class="metric"><span>预期差值</span><b>${escapeHtml((Number(r.observed)-Number(r.expected)).toFixed(2))}</b><span>例</span></div></div><div class="note">系统识别的是异常线索；数据真实不等于确认聚集或暴发。</div></article><article class="panel"><h2>建议核查方向</h2><p>${escapeHtml(r.hint)}</p></article></div><aside><article class="panel"><h2>时间与地点</h2><dl class="kv"><dt>生成时间</dt><dd>${escapeHtml(String(r.generated).replace('T',' '))}</dd><dt>数据更新至</dt><dd>${escapeHtml(r.updated)}</dd><dt>行政区域</dt><dd>${escapeHtml(r.region)}</dd><dt>场所类型</dt><dd>${escapeHtml(r.setting)}</dd><dt>场所名称</dt><dd>${escapeHtml(r.place)}</dd><dt>场所编号</dt><dd>${escapeHtml(r.placeCode)}</dd></dl></article></aside></div>`;
}
function openDetail(id){selected=all.find(x=>x.signal_id===id);tab=mode==='national'?'summary':'overview';$('listView').classList.add('hidden');$('detailView').classList.remove('hidden');renderDetail();scrollTo(0,0)}
function setMode(value){mode=value;$('cityMode').setAttribute('aria-pressed',mode==='city');$('nationalMode').setAttribute('aria-pressed',mode==='national');if(selected){tab=mode==='national'?'summary':'overview';renderDetail()}else renderList()}
async function startRun(inject){const st=$('runStatus');st.textContent='监测流程运行中……';document.querySelectorAll('#runControls button').forEach(b=>b.disabled=true);try{const response=await fetch('api/runs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({inject_outbreak:inject,injection_shape:'gradual',injection_magnitude:10,use_langgraph:true,autonomy_stage:3})});if(!response.ok)throw new Error(`HTTP ${response.status}`);const result=await response.json();st.textContent=`运行完成：${result.run_id||'结果已更新'}`;await load()}catch(error){st.textContent=`运行失败：${error.message}`}finally{document.querySelectorAll('#runControls button').forEach(b=>b.disabled=false)}}
async function load(){try{const [riskResponse,runResponse,institutionResponse]=await Promise.all([fetch('api/risks'),fetch('api/runs'),fetch('api/institutions')]);if(!riskResponse.ok||!runResponse.ok||!institutionResponse.ok)throw new Error('接口不可用');const risks=await riskResponse.json(),runs=await runResponse.json(),catalog=await institutionResponse.json();institutionCatalog=catalog.institutions||{};runsById=Object.fromEntries((runs.runs||[]).map(x=>[x.run_id,x]));const raw=(risks.risks||[]).filter(x=>x.syndrome==='respiratory'),first={};raw.forEach(x=>{const p=(x.evidence||{}).presentation||{},time=p.generated_at||(runsById[x.run_id]||{}).started_at||x.date;if(!first[x.signal_id]||String(time)<String(first[x.signal_id]))first[x.signal_id]=time});const seen=new Set();all=raw.slice().reverse().filter(x=>!seen.has(x.signal_id)&&seen.add(x.signal_id)).map(view).map(x=>({...x,generated:first[x.signal_id]||x.generated}));populate('city',all.map(x=>x.city));populate('setting',all.map(x=>x.setting));renderList()}catch(error){$('rows').innerHTML='';$('empty').textContent=`数据加载失败：${error.message}`;$('empty').classList.remove('hidden')}}
['city','setting','type','level','freshness'].forEach(id=>$(id).onchange=renderList);$('query').oninput=renderList;$('clear').onclick=()=>{['city','setting','type','level','freshness','query'].forEach(id=>$(id).value='');renderList()};$('cityMode').onclick=()=>setMode('city');$('nationalMode').onclick=()=>setMode('national');$('back').onclick=()=>{$('detailView').classList.add('hidden');$('listView').classList.remove('hidden');selected=null;renderList()};load();
</script>
</body>
