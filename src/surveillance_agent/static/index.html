<html lang="zh-CN">
<head>

<title>天眼 1.0 · 重点场所监测</title>
<style>
:root{--ink:#18314c;--sub:#5d7084;--line:#dce5ed;--blue:#245bc8;--nav:#122c46;--bg:#f3f6fa}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #5c96f2;outline-offset:2px}header{background:var(--nav);color:#fff;padding:18px 32px;display:flex;align-items:center;justify-content:space-between;gap:20px}header strong{font-size:20px;letter-spacing:1px}header small{display:block;color:#c0cddd}.switch{display:flex;background:#213f5d;padding:4px;border-radius:8px}.switch button{border:0;background:transparent;color:#d9e5f4;padding:8px 16px;border-radius:5px}.switch button[aria-pressed=true]{color:#142d46;background:#fff}.notice{background:#fff6df;color:#75530c;border-bottom:1px solid #ecd8a7;padding:9px 32px;font-size:12px}.shell{max-width:1500px;margin:auto;padding:25px 32px 35px}.row{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}h1{font-size:27px;margin:0 0 4px}h2{font-size:19px;margin:0 0 14px}h3{font-size:15px;margin:16px 0 8px}.muted{color:var(--sub)}.small{font-size:12px}.eyebrow{font-size:12px;font-weight:bold;letter-spacing:1px;color:var(--blue)}.button{border:1px solid #cbd8e4;border-radius:6px;background:#fff;color:var(--ink);padding:8px 13px}.primary{background:var(--blue);border-color:var(--blue);color:white}.button:disabled{opacity:.55;cursor:not-allowed}.controls,.tagrow{display:flex;gap:9px;flex-wrap:wrap}.summary{display:flex;margin:22px 0;background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px 0}.summary>div{padding:0 26px;border-right:1px solid var(--line);flex:1}.summary>div:last-child{border:0}.summary b{font-size:27px;display:block;line-height:1.2;margin:6px 0}.filters{display:flex;align-items:end;flex-wrap:wrap;gap:12px;margin-bottom:16px}.filters label{display:grid;gap:5px;font-size:12px;color:var(--sub)}input,select,textarea{border:1px solid #cbd8e4;border-radius:6px;background:#fff;color:var(--ink);padding:8px 10px}input{min-width:230px}select{min-width:120px}.panel{background:#fff;border:1px solid var(--line);border-radius:10px;padding:21px;margin-bottom:16px}.tablewrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:10px}table{width:100%;border-collapse:collapse;text-align:left}.signal-list{min-width:1480px}.signal-list th:nth-child(4),.signal-list td:nth-child(4){min-width:130px}.signal-list td:nth-child(4){white-space:nowrap}.signal-list th:nth-child(6),.signal-list td:nth-child(6){width:340px;min-width:340px}.signal-list .name{width:100%;min-width:300px;max-width:360px}thead{background:#eaf0f6;color:#405871}th{font-size:12px;font-weight:600;white-space:nowrap;padding:13px 15px}td{padding:15px;border-top:1px solid #e5ebf0;vertical-align:top}tbody tr:hover{background:#f8faff}.name{color:var(--blue);border:0;background:none;padding:0;text-align:left;font-weight:600;line-height:1.7;min-width:190px}.place{font-weight:600;min-width:150px}.nowrap{white-space:nowrap}.pill{font-size:12px;border-radius:4px;background:#edf2f7;color:#496178;padding:3px 8px;display:inline-block;white-space:nowrap}.Blue{background:#e6f0ff;color:#2357a2}.Yellow{background:#fff0c0;color:#755900}.Orange{background:#ffe8d8;color:#8b420f}.Red{background:#fde7e7;color:#a22f2f}.Pending{background:#edf0f2;color:#596674}.delay,.incomplete{background:#fff0d7;color:#835e18}.ok,.pass{background:#e6f5eb;color:#267047}.blocked{background:#fde7e7;color:#a22f2f}.note{padding:11px 13px;background:#f5f8fc;border-radius:5px;color:#486079;margin:12px 0}.warn{background:#fff4df;color:#835e18}.hidden{display:none!important}.empty{text-align:center;padding:60px 20px;color:var(--sub)}.link{border:0;background:none;color:var(--blue);padding:0}.tabs{display:flex;gap:20px;margin:20px 0;border-bottom:1px solid var(--line);overflow:auto}.tabs button{border:0;border-bottom:3px solid transparent;background:transparent;padding:10px 1px;color:var(--sub);white-space:nowrap}.tabs button.active{color:var(--blue);border-color:var(--blue);font-weight:bold}.grid{display:grid;grid-template-columns:1.65fr 1fr;gap:18px}.kv{display:grid;grid-template-columns:135px 1fr;gap:10px 20px}.kv dt{color:var(--sub)}.kv dd{margin:0;overflow-wrap:anywhere}.kv dt,.kv dd{border-bottom:1px solid #eef2f7;padding-bottom:9px}.metricgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}.metric{padding:16px;background:#f4f7fa;border-radius:6px}.metric b{display:block;font-size:21px;margin:8px 0}.metric span{font-size:12px;color:var(--sub)}.coretable td:first-child{width:230px;color:var(--sub);font-size:12px}.fieldkey{font-family:monospace;font-size:11px;color:#8192a4}.source{font-size:11px;background:#e6eaff;color:#3b4592;padding:2px 7px;border-radius:4px}.source.template{background:#edf0f2;color:#596674}.status{min-height:23px;color:var(--sub)}.history{border-left:2px solid #d8e3ef;padding-left:16px}.history>div{margin-bottom:14px}.history b{display:block}.review-layout{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(300px,1fr);gap:18px;align-items:stretch}.review-layout>.panel{margin-bottom:0}.review-form{display:grid;gap:14px;margin-top:18px}.review-form label{display:grid;gap:7px;color:var(--ink);font-weight:600}.review-form input,.review-form select,.review-form textarea{display:block;width:100%;min-width:0}.review-form textarea{min-height:96px;resize:vertical}.review-fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.review-helper{margin:-4px 0 0;color:var(--sub);font-size:12px}.review-save{width:100%;margin-top:2px}.review-ledger{min-height:100%}.review-statusline{margin:0 0 17px}.checklist{display:grid;gap:8px;margin-top:14px}.checkitem{display:flex;gap:8px;align-items:flex-start;padding:9px 10px;background:#f5f8fc;border-radius:5px}.raw{white-space:pre-wrap;word-break:break-word;background:#13283d;color:#d8e9f7;padding:18px;border-radius:7px;font:12px/1.65 Consolas,monospace;max-height:480px;overflow:auto}.catalog{font-size:11px;letter-spacing:.5px;color:#45617c}.danger{color:#a22f2f}.success{color:#267047}footer{font-size:12px;color:#73849a;padding:18px 0}
@media(max-width:850px){header{padding:15px;align-items:flex-start}.notice{padding:8px 15px}.shell{padding:20px 15px}.summary{display:grid;grid-template-columns:1fr 1fr}.summary>div{padding:10px 14px;border-bottom:1px solid var(--line)}.grid,.review-layout,.review-fields{grid-template-columns:1fr}.metricgrid{grid-template-columns:1fr}.filters label,.filters select,.filters input{width:100%}.filters label{flex:1 1 150px}.kv{grid-template-columns:105px 1fr}}
</style></head>
<body>
<header><div><strong>天眼 1.0 · 重点场所监测</strong><small>信号输出工作台 / 数据来源随运行配置</small></div><div class="switch"><button id="cityMode" aria-pressed="true">城市侧工作台</button><button id="nationalMode" aria-pressed="false">天眼摘要视图</button></div></header>
<div class="notice">按重点场所信号目录 21—28 展示。每条场所信号只对应一个机构；无法可靠归类的数据不会进入正式信号目录。信号用于提示核查，不代表已确认聚集或暴发。</div>
<main class="shell"><section id="listView">
<div class="row"><div><div class="eyebrow">SIGNAL WORKSPACE</div><h1>预警信号</h1><div class="muted" id="viewCaption"></div></div><div class="controls" id="runControls"><button class="button" onclick="startRun(false)">运行监测</button><button class="button primary" onclick="startRun(true)">注入异常并运行</button></div></div>
<div id="runStatus" class="status"></div><div class="summary" id="summary"></div>
<div class="filters"><label>城市<select id="city"><option value="">全部城市</option></select></label><label>场所类型<select id="setting"><option value="">全部场所</option></select></label><label>预警类型<select id="type"><option value="">全部类型</option><option>苗头预警</option><option>风险预警</option></select></label><label>等级<select id="level"><option value="">全部等级</option><option value="Pending">待研判</option><option value="Blue">蓝色 提示</option><option value="Yellow">黄色 关注</option><option value="Orange">橙色 警戒</option><option value="Red">红色 重要</option></select></label><label>核查状态<select id="verification"><option value="">全部状态</option><option>待核查</option><option>核查中</option><option>已核查</option></select></label><label id="freshnessFilter">数据状态<select id="freshness"><option value="">全部状态</option><option>正常</option><option>延迟</option><option>不完整</option><option>无有效数据</option><option>未知</option></select></label><label>搜索机构或信号<input id="query" placeholder="目录、机构、编号或信号"></label><button class="button" id="clear">清空筛选</button></div>
<div class="row small muted" style="margin:8px 0"><span id="count"></span><span id="latestBatch">当前批次：加载中</span></div>
<div class="tablewrap"><table class="signal-list"><thead id="head"></thead><tbody id="rows"></tbody></table><div id="empty" class="empty hidden">当前没有满足筛选条件的预警信号。</div></div></section>
<section id="detailView" class="hidden"><button id="back" class="link">← 返回信号列表</button><div id="detailHeader"></div><div class="tabs" id="tabs"></div><div id="detailBody"></div></section>
<footer>城市侧保留结构化证据、核查闭环和版本记录 · 天眼侧展示统一12字段摘要 · 未接入字段明确标为待补充</footer></main>
<script>
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const grade={Pending:'待研判',Blue:'蓝色 · 提示',Yellow:'黄色 · 关注',Orange:'橙色 · 警戒',Red:'红色 · 重要'},targetNames={ARI:'急性呼吸道感染症候群',ILI:'流感样病例',PNEUMONIA:'肺炎',FLU:'流感',COVID:'新型冠状病毒感染',RSV:'呼吸道合胞病毒相关感染',MP:'肺炎支原体感染',UNKNOWN:'病原未明确',OTHER:'其他'};
let mode='city',all=[],runsById={},catalogByCode={},selected=null,tab='overview';
function setting(x,p){if(p.is_regional_aggregate&&p.signal_code==='28')return'区域';if(x.source==='hospital')return'医院';if(x.source==='care_home')return'养老院';if(x.source==='school')return'学校';if(x.source==='market')return'农贸市场';if(x.source==='yichang_focus')return p.setting_type==='养老机构'?'养老院':p.setting_type==='学校'?'学校':'医院';return p.setting_type||'区域'}
function level(x){return['Blue','Yellow','Orange','Red'].includes(x)?x:'Pending'}
function parseDate(v){const d=new Date(String(v||'').slice(0,10));if(!Number.isNaN(d.getTime()))return d;return null}function daysLate(v,n){const d=parseDate(v);return d?Math.max(0,Math.floor((Date.now()-d)/86400000)-(n||1)):null}
function view(x){const e=x.evidence||{},p=e.presentation||{},run=runsById[x.run_id]||{},st=setting(x,p),city=p.city||(x.source==='yichang_focus'?'宜昌市':'未提供'),region=[p.province,city==='未提供'?'':city,p.district].filter(Boolean).join('／')||'行政区域待补充',regional=!!p.is_regional_aggregate||e.scope_type==='province';let place=p.place_name||e.scope_label||(regional?'区域汇总':'机构名称源数据未提供'),unit=p.analysis_unit||'';if(unit&&!place.includes(unit))place+=` / ${unit}`;const placeCode=p.place_code||'源数据未提供',updated=p.data_updated_at||x.date,late=p.data_delay_days??daysLate(updated,p.expected_update_interval_days),freshness=p.data_status||(late===null?'未知':late>0?'延迟':'正常'),targets=(p.monitored_targets||[]).map(v=>targetNames[v]||v).join('；')||'待补充';return{...x,e,p,setting:st,city,region,regional,place,placeCode,updated,late,freshness,generated:p.generated_at||run.started_at||x.date||'—',warningType:p.warning_type||'苗头预警',levelCode:level(p.warning_level),target:targets,signalName:p.signal_name||`${st}急性呼吸道症候群异常线索`,verify:p.verification_status||'待核查',window:p.monitoring_window||x.date||'—',key:p.key_indicator||`监测值 ${x.observed??'—'} 例，模型预期 ${x.expected??'—'} 例`,hint:p.verification_hint||'请核对病例明细、数据完整性和时空聚集情况。',code:p.signal_code||'待归类',payload:x.report_payload||{},validation:x.report_validation||{checks:[],blockers:[]}}}
function populate(id,values){const el=$(id),old=el.value;el.querySelectorAll('option:not(:first-child)').forEach(x=>x.remove());[...new Set(values.filter(Boolean))].sort().forEach(v=>{const o=document.createElement('option');o.value=o.textContent=v;el.appendChild(o)});el.value=old}
function filtered(){const q=$('query').value.trim().toLowerCase();return all.filter(r=>(!$('city').value||r.city===$('city').value)&&(!$('setting').value||r.setting===$('setting').value)&&(!$('type').value||r.warningType===$('type').value)&&(!$('level').value||r.levelCode===$('level').value)&&(!$('verification').value||r.verify===$('verification').value)&&(!$('freshness').value||r.freshness===$('freshness').value)&&(!q||`${r.code} ${r.place} ${r.placeCode} ${r.region} ${r.signalName}`.toLowerCase().includes(q))).sort((a,b)=>String(b.generated).localeCompare(String(a.generated)))}
function timeCell(v){const a=String(v||'—').replace('T',' ').split(' ');return`<span class="small">${esc(a[0]||'—')}</span><br><b>${esc((a[1]||'—').slice(0,8))}</b>`}
function fields(r){const p=r.payload||{};return[['预警信号ID','signal_id',p.signal_id],['上报时间','report_time',p.report_time||'待上报'],['行政区划编码','area_code',p.area_code||'待补充'],['重点场所类型','setting_type',p.setting_type||'待补充'],['重点场所名称或编码','setting_id_name',p.setting_id_name||'待补充'],['预警类型','warning_type',p.warning_type||'待补充'],['预警等级','warning_level',p.warning_level||'待研判'],['主要监测对象','monitored_target',p.monitored_target||'待补充'],['信号来源类型','signal_source_type',p.signal_source_type||'待补充'],['监测时间窗','monitoring_window',p.monitoring_window||'待补充'],['关键指标值','key_indicator_value',p.key_indicator_value||'待补充'],['信号说明与建议核查方向','signal_description_verification_hint',p.signal_description_verification_hint||'待补充']]}
function renderList(){const d=filtered();$('freshnessFilter').classList.toggle('hidden',mode==='national');$('runControls').classList.toggle('hidden',mode==='national');$('viewCaption').textContent=mode==='city'?'按两层结构查看信号、核查进度与数据质量。':'查看城市侧生成的统一12字段摘要及上报阻塞项。';const m=mode==='city'?[['筛选内信号',d.length],['待核查',d.filter(x=>x.verify==='待核查').length],['等级待研判',d.filter(x=>x.levelCode==='Pending').length],['数据异常',d.filter(x=>x.freshness!=='正常').length]]:[['筛选内信号',d.length],['苗头预警',d.filter(x=>x.warningType==='苗头预警').length],['风险预警',d.filter(x=>x.warningType==='风险预警').length],['可上报',d.filter(x=>x.validation.ready).length]];$('summary').innerHTML=m.map(x=>`<div><span class="muted small">${x[0]}</span><b>${esc(x[1])}</b></div>`).join('');$('count').textContent=`显示 ${d.length} 条呼吸道传染病信号，共 ${all.length} 条 · 目录26与27按关联信号展示，不等同于两个独立事件`;const h=['信号产生时间','行政区域','场所名称','预警类型','预警等级','预警内容（信号名称）','关键证据','信号核查状态'];$('head').innerHTML='<tr>'+h.map(x=>`<th>${x}</th>`).join('')+'</tr>';$('rows').innerHTML=d.map(r=>`<tr><td class="nowrap">${timeCell(r.generated)}</td><td>${esc(r.region)}</td><td class="place">${esc(r.place)}<div class="muted small">${esc(r.setting)} · ${esc(r.placeCode)}</div></td><td>${esc(r.warningType)}<div class="catalog">目录 ${esc(r.code)}</div></td><td><span class="pill ${r.levelCode}">${grade[r.levelCode]}</span><div class="small muted">${esc(r.p.warning_level_scheme||'')}</div></td><td><button class="name" data-open="${esc(r.signal_id)}">${esc(r.signalName)}</button><div class="catalog">目录 ${esc(r.code)} · ${esc(r.warningType)}</div></td><td>${esc(r.key)}</td><td>${esc(r.verify)}<div><span class="pill ${r.freshness==='正常'?'ok':r.freshness==='不完整'?'incomplete':'delay'}">${esc(r.freshness)}</span></div></td></tr>`).join('');$('empty').classList.toggle('hidden',d.length>0);document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openDetail(b.dataset.open))}
function explanation(r){return`<span class="source ${r.explanation_source==='llm'?'':'template'}">${r.explanation_source==='llm'?'LLM 生成':'模板生成'}</span><p>${esc(r.explanation||'本条信号尚未生成解释。')}</p>`}function delay(r){return r.freshness==='延迟'?`<div class="note warn"><b>数据更新延迟：</b>更新至 ${esc(r.updated)}，延迟 ${esc(r.late)} 天。无新数据不代表无异常。</div>`:''}function core(r){return`<table class="coretable"><tbody>${fields(r).map(x=>`<tr><td>${x[0]}<div class="fieldkey">${x[1]}</div></td><td>${esc(x[2]||'待补充')}</td></tr>`).join('')}</tbody></table>`}
function evidence(r){const a=r.p.evidence_items||[];return a.length?`<div class="tablewrap"><table><thead><tr><th>指标</th><th>观察值</th><th>单位</th><th>分母</th><th>比较值／阈值</th><th>数据来源与时间</th><th>判定</th></tr></thead><tbody>${a.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.value)}</td><td>${esc(x.unit||'—')}</td><td>${x.denominator===null||x.denominator===undefined?'—':esc(x.denominator)}</td><td>${x.comparison_value!==null&&x.comparison_value!==undefined?esc(x.comparison_value):x.threshold_value!==undefined?esc(x.threshold_value):'—'}</td><td>${esc(x.source||'—')}<div class="small muted">${esc(x.window||'')} · 更新至 ${esc(x.data_updated_at||'—')}</div></td><td>${x.role==='detector'?(x.alarm?'触发':'未触发'):'依据项'}</td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">旧版本信号没有结构化证据；重新运行后生成。</p>'}
function historyHtml(r){const h=r.p.change_log||[];return h.length?h.slice().reverse().map(x=>`<div><b>版本 ${esc(x.update_seq)} · ${esc(x.action)}${x.actor?` · ${esc(x.actor)}`:''}</b><span class="small muted">${esc(String(x.changed_at).replace('T',' '))}</span><div>${esc(x.detail)}</div></div>`).join(''):`<div><b>版本 1 · 系统生成</b><span class="small muted">${esc(String(r.generated).replace('T',' '))}</span><div>模型生成信号，等待人工核查。</div></div>`}
function validationHtml(r){const checks=r.validation.checks||[];return`<div class="checklist">${checks.map(x=>`<div class="checkitem"><span class="pill ${x.status}">${x.status==='pass'?'通过':'阻塞'}</span><div><b>${esc(x.check_id)}</b> ${esc(x.message)}</div></div>`).join('')}</div>`}
function renderDetail(){const r=selected;if(!r)return;$('detailHeader').innerHTML=`<div class="row" style="margin-top:17px"><div><div class="eyebrow">目录 ${esc(r.code)} / ${esc(r.warningType)}</div><h1>${esc(r.signalName)}</h1><div class="muted">${esc(r.region)} · ${esc(r.setting)} · ${esc(r.place)}</div><div class="tagrow"><span class="pill">信号ID ${esc(r.signal_id)}</span><span class="pill">版本 ${esc(r.p.update_seq||1)}</span><span class="pill">核查：${esc(r.verify)}</span><span class="pill">业务：${esc(r.p.record_status||'ACTIVE')}</span></div></div><span class="pill ${r.levelCode}">${grade[r.levelCode]}</span></div>`;const ts=mode==='national'?[['summary','12字段上报摘要']]:[['overview','信号详情'],['evidence','证据与规则'],['review','核查反馈'],['summary','12字段摘要'],['raw','JSON']];if(!ts.some(x=>x[0]===tab))tab=ts[0][0];$('tabs').innerHTML=ts.map(x=>`<button data-tab="${x[0]}" class="${tab===x[0]?'active':''}" aria-selected="${tab===x[0]}">${x[1]}</button>`).join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;renderDetail()});
if(tab==='summary'){const ready=r.validation.ready;$('detailBody').innerHTML=`<div class="note ${ready?'':'warn'}">${ready?'12字段及配置校验通过，可进入接口提交准备。':'这是未发送的摘要。当前存在阻塞项，不能作为正式上报报文。'}</div><div class="grid"><article class="panel"><div class="row"><h2>城市侧统一12字段摘要</h2><button class="button" id="copySummary">复制 JSON</button></div>${core(r)}</article><aside class="panel"><h2>上报校验</h2><p><span class="pill ${ready?'pass':'blocked'}">${ready?'可进入提交准备':'存在阻塞'}</span></p>${validationHtml(r)}</aside></div>`;$('copySummary').onclick=()=>navigator.clipboard.writeText(JSON.stringify(r.payload,null,2));return}
if(tab==='raw'){$('detailBody').innerHTML=`<div class="panel"><h2>完整信号记录</h2><pre class="raw">${esc(JSON.stringify(r,null,2))}</pre></div>`;return}
if(tab==='review'){renderReview(r);return}
if(tab==='evidence'){$('detailBody').innerHTML=`${delay(r)}<div class="grid"><div><article class="panel"><h2>量化依据</h2>${evidence(r)}<h3>统计窗口</h3><dl class="kv"><dt>窗口起止</dt><dd>${esc(r.p.window_start||'—')} 至 ${esc(r.p.window_end||'—')}</dd><dt>窗口口径</dt><dd>${esc(r.p.window_basis||'待补充')}</dd><dt>对比口径</dt><dd>${esc(r.p.comparison_policy||'待补充')}</dd></dl><h3>触发规则与边界</h3><p>${esc(r.p.raw_rule||'规则待配置')}</p><div class="note warn">规则 ${esc(r.p.rule_id||'待配置')} / 版本 ${esc(r.p.rule_version||'待配置')} / 状态 ${esc(r.p.rule_status||'待配置')}。目录规则未通过业务验证前不作为法定报告标准。</div></article></div><aside><article class="panel"><h2>来源与信号范围</h2><dl class="kv"><dt>来源类型</dt><dd>${esc(r.p.catalog_source_type||'待补充')}</dd><dt>实际数据来源</dt><dd>${esc(r.p.source_details||'待补充')}</dd><dt>目录解释</dt><dd>${esc(r.p.catalog_explanation||'待补充')}</dd><dt>判断边界</dt><dd>${esc(r.p.catalog_boundary||'待补充')}</dd></dl></article><article class="panel"><h2>关联信号</h2>${(r.p.related_signal_ids||[]).length?r.p.related_signal_ids.map(id=>`<button class="button related-id" data-id="${esc(id)}">${esc(id)}</button>`).join(' '):(r.p.related_signal_codes||[]).length?`当前无关联实例；目录关系：${r.p.related_signal_codes.map(c=>`<button class="link related" data-code="${esc(c)}">目录${esc(c)}</button>`).join(' ')}`:'<span class="muted">无目录关联</span>'}</article><article class="panel"><h2>更新记录</h2><div class="history">${historyHtml(r)}</div></article></aside></div>`;document.querySelectorAll('.related').forEach(b=>b.onclick=()=>openRelated(b.dataset.code,r));document.querySelectorAll('.related-id').forEach(b=>b.onclick=()=>openDetail(b.dataset.id));return}
const issues=(r.p.data_issues||[]).map(x=>`<div class="note warn">${esc(x)}。无数据或缺报不等于0病例，也不等于无疫情。</div>`).join('');const hints=r.p.verification_hints||[r.hint];$('detailBody').innerHTML=`${issues}<div class="grid"><div><article class="panel"><h2>信号内容解释</h2><p>${esc(r.p.catalog_explanation||'')}</p><h3>本次数据解释</h3>${explanation(r)}<div class="metricgrid"><div class="metric"><span>监测值</span><b>${esc(r.observed)}</b><span>例</span></div><div class="metric"><span>模型预期</span><b>${esc(r.expected)}</b><span>例</span></div><div class="metric"><span>模型严重度</span><b>${esc(r.p.model_severity||'—')}</b><span>与业务颜色分开保存</span></div></div><div class="note">统计线索用于启动核查；数据真实不等于确认聚集或暴发。</div></article><article class="panel"><h2>建议核查内容</h2><ul>${hints.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><div class="small muted">具体采样、隔离和专业确认由获得授权的人员结合适用要求评估。</div><button class="button primary" id="goReview" style="margin-top:14px">进入核查反馈</button></article></div><aside><article class="panel"><h2>时间与地点</h2><dl class="kv"><dt>生成时间</dt><dd>${esc(String(r.generated).replace('T',' '))}</dd><dt>上报时间</dt><dd>${esc(r.p.report_time||'尚未上报')}</dd><dt>数据更新至</dt><dd>${esc(r.updated)}</dd><dt>统计时段</dt><dd>${esc(r.window)}；${esc(r.p.window_basis||'')}</dd><dt>行政区域</dt><dd>${esc(r.region)}<br><span class="small muted">区划编码：${esc(r.p.area_code||'待补充')}</span></dd><dt>具体地址</dt><dd>${esc(r.p.address||'待补充')}</dd><dt>场所编码</dt><dd>${esc(r.placeCode)}</dd><dt>具体位置</dt><dd>${esc(r.p.analysis_unit||'待补充')}</dd></dl></article><article class="panel"><h2>任务与截止时间</h2><dl class="kv"><dt>任务名称</dt><dd>${esc(r.p.task_name||'未设定')}</dd><dt>负责人</dt><dd>${esc(r.p.task_owner||'未设定')}</dd><dt>截止时间</dt><dd>${esc(r.p.task_due_at||'未设定')}</dd><dt>观察周期</dt><dd>${esc(r.p.observation_period||'未配置')}</dd><dt>任务状态</dt><dd>${esc(r.p.task_status||'未设定')}</dd></dl><p class="small muted">截止时间不是疫情结束时间；未设置截止时间时不判定逾期。</p></article></aside></div>`;$('goReview').onclick=()=>{tab='review';renderDetail()}}

function renderReview(r){const p=r.p,closed=['CLOSED','EXCLUDED'].includes(p.record_status),current=`当前：${r.verify} / ${p.record_status||'ACTIVE'}。结果：${p.verification_result||'尚未核查'}`;$('detailBody').innerHTML=`<div class="review-layout"><article class="panel"><h2>核查反馈</h2><div class="note review-statusline">${esc(current)}</div><div class="review-form"><label>核查人（必填）<input id="reviewer" value="${esc(p.reviewer||'')}" placeholder="填写姓名或工作账号"></label><button class="button primary" id="startReview" ${closed||r.verify==='核查中'?'disabled':''}>开始核查</button><label>本地核查结果<select id="reviewResult" ${closed?'disabled':''}><option value="">请选择</option>${['信息待补充','异常属实待研判','已排除','关闭跟踪'].map(x=>`<option ${p.verification_result===x?'selected':''}>${x}</option>`).join('')}</select></label><label>反馈依据及后续安排<textarea id="reviewReason" ${closed?'disabled':''} placeholder="写明核对了哪些资料、结论依据和后续安排；不录入个人身份信息。">${esc(p.review_reason||'')}</textarea></label><h3>核查任务（可选）</h3><div class="review-fields"><label>任务名称<input id="taskName" value="${esc(p.task_name||'')}" placeholder="如：核对缺勤和就诊记录"></label><label>负责人<input id="taskOwner" value="${esc(p.task_owner||'')}" placeholder="姓名或岗位"></label><label>截止时间<input id="taskDue" type="datetime-local" value="${esc((p.task_due_at||'').slice(0,16))}"></label><label>任务状态<select id="taskStatus"><option value="">未设定</option>${['未开始','进行中','已完成','已取消'].map(x=>`<option ${p.task_status===x?'selected':''}>${x}</option>`).join('')}</select></label></div><label>观察周期<input id="observationPeriod" value="${esc(p.observation_period||'')}" placeholder="如：连续观察7个教学日"></label><p class="review-helper">先“开始核查”再保存结论。已排除或关闭后记录锁定；专业确认疫情性质仍需授权审核。</p><button class="button primary review-save" id="saveReview" ${closed?'disabled':''}>保存核查反馈</button><span id="reviewStatus" class="status">${closed?'该记录已关闭，保留历史记录。':''}</span></div></article><aside class="panel review-ledger"><h2>本地处理记录</h2><div class="history">${historyHtml(r)}</div></aside></div>`;$('startReview').onclick=()=>submitReview('start');$('saveReview').onclick=()=>submitReview('save')}
async function submitReview(action){const s=$('reviewStatus'),reviewer=$('reviewer')?.value.trim()||'',result=$('reviewResult')?.value||'',reason=$('reviewReason')?.value.trim()||'';if(!reviewer){s.textContent='请先填写核查人。';s.className='danger';return}if(action==='save'&&(!result||!reason)){s.textContent='请选择核查结果并填写说明。';s.className='danger';return}const payload={action,result,reason,reviewer,task_name:$('taskName')?.value.trim()||'',task_owner:$('taskOwner')?.value.trim()||'',task_due_at:$('taskDue')?.value||'',observation_period:$('observationPeriod')?.value.trim()||'',task_status:$('taskStatus')?.value||''};s.textContent='正在保存……';try{const res=await fetch(`api/signals/${encodeURIComponent(selected.signal_id)}/review`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}),body=await res.json();if(!res.ok){const names={reviewer_required:'核查人不能为空',start_review_required:'请先点击“开始核查”',record_closed:'该记录已经关闭，不能继续修改',result_and_reason_required:'核查结果和说明不能为空'};throw new Error(names[body.error]||body.error||`HTTP ${res.status}`)}await load(selected.signal_id);selected=all.find(x=>x.signal_id===selected.signal_id);renderDetail()}catch(e){s.textContent=`保存失败：${e.message}`;s.className='danger'}}
function openRelated(code,r){const found=all.find(x=>x.code===code&&(x.city===r.city||x.regional));if(found){selected=found;tab='overview';renderDetail();scrollTo(0,0)}else alert(`当前运行没有生成目录 ${code} 信号。目录关联仅表示业务关系。`)}
function openDetail(id){selected=all.find(x=>x.signal_id===id);tab=mode==='national'?'summary':'overview';$('listView').classList.add('hidden');$('detailView').classList.remove('hidden');renderDetail();scrollTo(0,0)}function setMode(v){mode=v;$('cityMode').setAttribute('aria-pressed',mode==='city');$('nationalMode').setAttribute('aria-pressed',mode==='national');if(selected){tab=mode==='national'?'summary':'overview';renderDetail()}else renderList()}
async function startRun(inject){const s=$('runStatus');s.textContent='监测流程运行中……';document.querySelectorAll('#runControls button').forEach(b=>b.disabled=true);try{const r=await fetch('api/runs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({inject_outbreak:inject,injection_shape:'gradual',injection_magnitude:10,use_langgraph:true,autonomy_stage:3})});if(!r.ok)throw new Error(`HTTP ${r.status}`);const b=await r.json();s.textContent=`运行完成：${b.run_id||'结果已更新'}`;await load()}catch(e){s.textContent=`运行失败：${e.message}`}finally{document.querySelectorAll('#runControls button').forEach(b=>b.disabled=false)}}
async function load(keep=''){try{const [rr,ur,cr]=await Promise.all([fetch('api/risks?latest_only=true'),fetch('api/runs'),fetch('api/signal-catalog')]);if(!rr.ok||!ur.ok||!cr.ok)throw new Error('接口不可用');const risks=await rr.json(),runs=await ur.json(),catalog=await cr.json();runsById=Object.fromEntries((runs.runs||[]).map(x=>[x.run_id,x]));catalogByCode=Object.fromEntries((catalog.signals||[]).map(x=>[String(x.code),x]));const seen=new Set();all=(risks.risks||[]).filter(x=>x.syndrome==='respiratory').reverse().filter(x=>!seen.has(x.signal_id)&&seen.add(x.signal_id)).map(view);$('latestBatch').textContent=`当前批次：${risks.run_id||'暂无完成运行'}`;populate('city',all.map(x=>x.city));populate('setting',all.map(x=>x.setting));renderList();if(keep)selected=all.find(x=>x.signal_id===keep)}catch(e){$('rows').innerHTML='';$('latestBatch').textContent='当前批次：加载失败';$('empty').textContent=`数据加载失败：${e.message}`;$('empty').classList.remove('hidden')}}
['city','setting','type','level','verification','freshness'].forEach(id=>$(id).onchange=renderList);$('query').oninput=renderList;$('clear').onclick=()=>{['city','setting','type','level','verification','freshness','query'].forEach(id=>$(id).value='');renderList()};$('cityMode').onclick=()=>setMode('city');$('nationalMode').onclick=()=>setMode('national');$('back').onclick=()=>{$('detailView').classList.add('hidden');$('listView').classList.remove('hidden');selected=null;renderList()};load();
</script></body></html>
